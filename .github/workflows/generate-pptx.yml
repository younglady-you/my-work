name: Generate PPTX and PDF

on:
  workflow_dispatch: {}
  push:
    branches: [ 'add-pptx' ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx
          sudo apt-get update
          sudo apt-get install -y libreoffice-core libreoffice-writer libreoffice-impress

      - name: Generate PPTX using script
        run: |
          python3 ppt/generate_ppt.py

      - name: Convert PPTX to PDF (LibreOffice headless)
        run: |
          soffice --headless --convert-to pdf --outdir ppt ppt/试用期工作总结_SSC_薪酬核算专员.pptx || true

      - name: Commit generated artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ppt/试用期工作总结_SSC_薪酬核算专员.pptx ppt/试用期工作总结_SSC_薪酬核算专员.pdf || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add generated PPTX and PDF artifacts"
            git push origin HEAD:refs/heads/add-pptx
          fi
